version = 3.11.5

runner.dialect = scala3

maxColumn = 120

align.preset = more

newlines {
  source = keep

  selectChains {
    style = unfold
  }
}

rewrite {
  rules = [RedundantBraces, RedundantParens]

  redundantBraces {
    parensForOneLineApply = false
    stringInterpolation = true
  }

  redundantParens {
    infixSide = all
  }

  trailingCommas.style = keep

  scala3 {
    convertToNewSyntax = true
    optionalBraces.enabled = true
  }
}

docstrings {
  style = Asterisk
  wrap = yes
  wrapMaxColumn = 80
}