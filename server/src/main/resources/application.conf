app {
  # Application mode: "dev" or "production"
  # In "dev" mode, responses include schema metadata in the "meta" field and schemas are printed to console
  mode = "dev"
}

db {
  host = "127.0.0.1"
  port = 5433
  database = "postgres"
  user = "postgres"
  password = "password"
  maxPoolSize = 5
}

openai {
  baseUrl = "http://127.0.0.1:9931/v1"
  timeoutSeconds = 60
}

conduit {
  baseUrl = "http://localhost:5173/api"
  frontendUrl = "http://localhost:5173"
  //  baseUrl = "https://rwa-api.guihigashi.dev/api"
  //  frontendUrl = "https://rwa.guihigashi.dev"
  timeoutSeconds = 10
  fallbackToSimulated = false
}

redis {
  host = "127.0.0.1"
  port = 6380
}

zio.http.server {
  binding-port = 8081
}